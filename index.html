<!DOCTYPE html>
<html lang="ur">
<head>
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffcc00">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pakistan Weather - Live Mausam | Karachi, Lahore, Bahawalpur</title>
<meta name="description" content="Pakistan ke kisi bhi shehar ka live mausam dekhein - Karachi, Lahore, Islamabad, Bahawalpur, Multan ka temperature, barish, hawa.">
<meta name="keywords" content="Pakistan weather, Karachi weather, Lahore weather, Bahawalpur mausam, Islamabad temperature">
<meta name="theme-color" content="#ffcc00">
<link rel="manifest" href="manifest.json">

<style>
body{font-family:sans-serif;background:#0f0f0f;color:white;text-align:center;padding:20px;margin:0}
.card{background:#1e1e1e;padding:20px;border-radius:20px;max-width:400px;margin:20px auto;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
input{padding:12px;width:70%;border-radius:10px;border:none;outline:none;font-size:16px}
button{padding:12px 18px;border-radius:10px;border:none;background:#ffcc00;font-weight:bold;margin-left:5px;cursor:pointer}
#icon{font-size:80px;margin:10px}
.temp{font-size:50px;font-weight:bold;margin:5px}
.info{display:flex;justify-content:space-around;margin-top:15px;background:#2a2a2a;padding:10px;border-radius:10px}
</style>
</head>
<body>

<h2>🇵🇰 Pakistan Live Weather</h2>
<p>Kisi bhi shehar ka naam likhein</p>

<input id="city" placeholder="Jaise: Bahawalpur, Karachi, Lahore">
<button onclick="getWeather()">Search</button>

<div class="card" id="result" style="display:none">
  <div id="icon">☀️</div>
  <div class="temp" id="temp">--°C</div>
  <div id="cityName">--</div>
  <div id="desc">--</div>
  <div class="info">
    <div>💧<br><span id="humidity">--%</span><br>Humidity</div>
    <div>💨<br><span id="wind">-- km/h</span><br>Hawa</div>
    <div>🌡️<br><span id="feels">--°</span><br>Mehsoos</div>
  </div>
</div>

<script>
async function getWeather(){
  let city = document.getElementById('city').value;
  if(!city) city = "Bahawalpur";
  
  document.getElementById('cityName').innerText = "Loading " + city + "...";
  document.getElementById('result').style.display = "block";

  try {
    // 1. Shehar ka latitude longitude nikalo
    let geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=en&format=json`);
    let geoData = await geo.json();
    if(!geoData.results){ alert("Shehar nahi mila! Sahi naam likho"); return; }
    let lat = geoData.results[0].latitude;
    let lon = geoData.results[0].longitude;
    let name = geoData.results[0].name + ", " + geoData.results[0].country;

    // 2. Mausam nikalo
    let weather = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`);
    let data = await weather.json();
    let c = data.current;

    // 3. Icon set karo
    let code = c.weather_code;
    let icon = "☀️";
    let text = "Saaf Mausam";
    if(code > 1 && code < 4){ icon = "⛅"; text = "Badal"; }
    if(code >= 51 && code <= 67){ icon = "🌧️"; text = "Barish"; }
    if(code >= 71){ icon = "❄️"; text = "Sardi / Baraf"; }
    if(code >= 95){ icon = "⛈️"; text = "Toofan / Barish"; }

    document.getElementById('icon').innerText = icon;
    document.getElementById('temp').innerText = Math.round(c.temperature_2m) + "°C";
    document.getElementById('cityName').innerText = name;
    document.getElementById('desc').innerText = text;
    document.getElementById('humidity').innerText = c.relative_humidity_2m + "%";
    document.getElementById('wind').innerText = Math.round(c.wind_speed_10m) + " km/h";
    document.getElementById('feels').innerText = Math.round(c.apparent_temperature_2m) + "°";

  } catch(e){ alert("Internet check karo"); }
}

// Bahawalpur default
getWeather();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
